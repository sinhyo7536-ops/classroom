.rns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rns button{padding:8px 4px;font-size:clamp(13px,1.7vw,21px);border:2px solid var(--line);background:var(--card)}
.rns button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rres{border:3px solid var(--pri);border-radius:14px;padding:10px 12px;background:var(--card);text-align:center}
.rres .a{font-size:clamp(15px,2vw,24px);color:var(--sub);font-weight:800}
.rres .b{font-size:clamp(22px,3.6vw,46px);font-weight:800;color:var(--pri);line-height:1.2}
.rres .c{font-size:clamp(13px,1.7vw,20px);color:var(--sub);margin-top:4px;font-weight:700}
.reg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.reg .rc{min-height:clamp(54px,9vh,90px)}
</style>

<body>
<div id="off"><div id="offm"></div></div><button id="slp" onclick="sleepNow()">🌑 화면 끄기</button>
<div id="app"></div>
<div id="am"></div>
<div id="sp"></div>
<div id="tmo"></div>
<div id="pin"></div>
<div id="brk"></div>
<div id="kb"><div class="kbw"><div id="kbr"></div></div></div>
<button id="kbfab" type="button" onmousedown="event.preventDefault()" onclick="kbShow()">⌨ 키보드</button>
<script>
const $=document.getElementById("app");
let cfg={"names":["1번","2번","3번","4번","5번","6번","7번","8번","9번","10번","11번","12번","13번","14번","15번","16번","17번","18번","19번","20번","21번","22번","23번","24번","25번"],"milk":["1번","2번","4번","5번","6번","7번","8번","10번","12번","13번","14번","15번","16번","19번","20번","21번","22번","25번"]}, chk={phone:{},milk:{}}, mode="board", draft="";
const pad=n=>String(n).padStart(2,"0"); const d=new Date();
const today=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const KC="classcheck:roster", KD="classcheck:"+today;
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
cfg=load(KC,cfg); chk=load(KD,chk);
if(!cfg.names.length){mode="setup"}
const KS="classcheck:sched2";
const DEF=[["아침시간","08:30","09:00",0],["1교시","09:00","09:40",1],["쉬는시간","09:40","09:50",0],["2교시","09:50","10:30",1],["쉬는시간","10:30","10:40",0],["3교시","10:40","11:20",1],["쉬는시간","11:20","11:30",0],["4교시","11:30","12:10",1],["쉬는시간","12:10","12:20",0],["5교시","12:20","13:00",1],["점심시간","13:00","13:50",0],["6교시","13:50","14:30",1]];
let sched=load(KS,null)||{on:true,rows:JSON.parse(JSON.stringify(DEF))}, wake=0, taps=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 명단 한 줄: "12 홍길동"처럼 번호와 이름. 번호를 빼면 줄 순서가 번호가 돼요. */
const lineOf=s=>{const m=s.match(/^(\d{1,2})\s*(?:번|\.|\)|:|-)?\s+(.+)$/)||s.match(/^(\d{1,2})(?:번|\.|\)|:|-)\s*(.+)$/);return m?{no:+m[1],n:m[2].trim()}:{no:0,n:s}};
const rosterRows=t=>{const seen=new Set();return t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(lineOf).filter(x=>x.n&&!seen.has(x.n)&&seen.add(x.n))};
const parse=t=>rosterRows(t).map(x=>x.n);
const parseNo=t=>{const r=rosterRows(t),o={};r.forEach((x,i)=>{o[x.n]=x.no||i+1});return o};
const numOf=n=>{const v=cfg.no&&cfg.no[n];return v?+v:cfg.names.indexOf(n)+1};
const rosterTxt=()=>cfg.names.map(n=>numOf(n)+" "+n).join("\n");
draft=rosterTxt();

function render(){mode==="menued"?menuEdit():mode==="setup"?setup():mode==="sched"?schedView():mode==="song"?songView():mode==="game"?gameView():mode==="timer"?timerView():mode==="sugg"?suggView():mode==="upd"?updView():mode==="role"?roleView():mode==="roleedit"?roleEdit():board();kbUI()}
const AL={late:"지각",abs:"결석",early:"조퇴"};const A=()=>chk.att||(chk.att={});const isA=n=>!!A()[n];
/* 우유판에서는 결석·조퇴만 면제 (지각생도 우유는 마셔야 해요) */
const atOf=(k,n)=>{const a=A()[n];return k==="phone"?a:(a==="abs"||a==="early"?a:"")};
const full=(k,l)=>l.length>0&&l.every(n=>chk[k][n]==="o"||!!atOf(k,n));
/* ===== 자동 지각 / 우유판 잠금 ===== */
const LATE_AT=8*60+50; /* 오전 8:50 */
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const school=()=>d.getDay()>=1&&d.getDay()<=5;
const milkLockAt=()=>d.getDay()===3?12*60+10:13*60+50; /* 수 12:10, 월화목금 13:50 */
const milkPast=()=>school()&&nowM()>=milkLockAt();
const milkLocked=()=>milkPast()&&!chk.milkOpen;
function autoLate(){
  if(!school()||chk.lateDone||nowM()<LATE_AT)return false;
  cfg.names.forEach(n=>{if(chk.phone[n]!=="o"&&!A()[n]&&!isEx(n))A()[n]="late"});
  chk.lateDone=1;save(KD,chk);return true;
}
/* 지각 예외 학생 (⚙ 명단에서 설정) */
const isEx=n=>!!cfg.ex&&Object.prototype.hasOwnProperty.call(cfg.ex,n);
const LOCK_SVG=`<svg viewBox="0 0 100 120" aria-hidden="true"><path d="M28 54V36a22 22 0 0 1 44 0v18" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><rect x="12" y="50" width="76" height="62" rx="12" fill="currentColor"/><circle cx="50" cy="76" r="8" fill="var(--card)"/><rect x="46" y="78" width="8" height="18" rx="3" fill="var(--card)"/></svg>`;
let mlk=null;
function autoCheck(){const a=autoLate(),l=milkLocked();if(a||l!==mlk){mlk=l;if(mode==="board")board()}}
/* 우유당번: 잠긴 뒤 못 마신 학생을 랜덤으로 섞어 1. 등교/하교, 2. 등교/하교 … 순서로 정해요 (그날 한 번 정하면 유지) */
function dutyOrder(list){
  const key=[...list].sort().join("|");
  if(!chk.duty||chk.duty.key!==key){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}chk.duty={key,order:a};save(KD,chk)}
  return chk.duty.order;
}
const dutyLbl=i=>`${i%2?"하교":"등교"} ${Math.floor(i/2)+1}`;
function dutyRedo(){chk.duty=null;save(KD,chk);board()}
function milkNote(lk,ord){
  const w=d.getDay()===3,a=!w&&school();
  if(lk){
    if(!ord.length)return `<div class="mnote lk">🔒 잠겼어요! 모두 우유를 마셨어요 👏</div>`;
    const pr=[];for(let i=0;i<ord.length;i+=2)pr.push(`<span class="dp"><b>${i/2+1}.</b> 등교 <em>${esc(ord[i])}</em> · 하교 <em>${ord[i+1]?esc(ord[i+1]):"—"}</em></span>`);
    return `<div class="mnote lk"><div class="dh">🥛 우유당번 <button class="dr" onclick="askPin(dutyRedo)">🔀 다시 뽑기 🔒</button></div><div class="dps">${pr.join("")}</div></div>`;
  }
  return `<div class="mnote">잠기는 시간<br><b class="${a?"td":""}">오후 1시 50분</b><br><b class="${w?"td":""}">수요일은 낮 12시 10분</b></div>`;
}
const clkTxt=()=>{const n=new Date();return `${pad(n.getHours())}시 ${pad(n.getMinutes())}분`};
function milkToggle(){chk.milkOpen=chk.milkOpen?0:1;save(KD,chk);mlk=null;autoCheck()}
let warnMode=false;
function board(){
  if(admUntil===Infinity)admUntil=0; /* 체크판으로 돌아오면 다시 잠겨요 */
  const pl=cfg.names,ml=pl.filter(n=>cfg.milk.includes(n)),all=full("phone",pl)&&(ml.length===0||full("milk",ml));
  const days=["일","월","화","수","목","금","토"];
  $.innerHTML=`<header><h1>📋 ${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]}) 우리 반 체크판</h1><span class="clk" id="clk">${clkTxt()}</span>${tmChip()}
  <button class="${warnMode?"warnon":""}" onclick="warnMode=!warnMode;board()">${warnMode?"⚠ 경고주기 끝내기":"⚠ 경고주기"}</button><button onclick="allO('phone');allO('milk')">⭕ 전체 O</button><button onclick="ask(this,clr)">초기화</button><button onclick="fs()">${document.fullscreenElement?"⛶ 해제":"⛶ 전체화면"}</button><div class="mn"><button class="pri" onclick="tgm(event)">☰ 메뉴${(d.getDay()===1||d.getDay()===4)?" 🎵":""}${d.getDay()===3?" 🎲":""}${sNew()?` 📮${sNew()}`:""}${updNew()?" 🆕":""}</button><div class="dd" id="dd">${menuHTML()}</div></div></header>
  <main>${panel("phone","📱 휴대폰 껐나요?",cfg.names)}${panel("milk","🥛 우유 마셨나요?",cfg.names.filter(n=>cfg.milk.includes(n)))}</main>${all?`<div class="allo"><div class="ring"></div><div class="bw"><div class="ban">🎉 모두 달성! 🎉</div></div></div>`:""}`;
}
function panel(k,title,list){
  const lk=k==="milk"&&milkLocked();
  const ord=lk?dutyOrder(list.filter(n=>!atOf(k,n)&&chk[k][n]!=="o")):[];
  const c={o:0,x:0,n:0}; list.forEach(n=>{const v=atOf(k,n)?"o":chk[k][n];c[v==="o"?"o":v==="x"?"x":"n"]++});
  const body=list.length?list.map(n=>{const at=atOf(k,n),v=at?"":(chk[k][n]||""),dy=lk&&!at&&v!=="o";const wv=(chk.warn||{})[n]||0;return `<div class="s ${at?"a a-"+at:dy?"duty":v}${wv?" w"+wv:""}" data-k="${k}" data-n="${esc(n)}">${wv?`<i class="wn">${wv===1?"⚠️":"❌"}</i>`:""}<span style="font-size:min(${Math.floor(88/Math.max([...n].length,3))}cqw,4.6vh)">${esc(n)}</span><i>${at?AL[at]+(at==="late"&&chk[k][n]==="o"?"⭕":""):dy?dutyLbl(ord.indexOf(n)):v==="o"?"⭕":v==="x"?"❌":""}</i></div>`}).join(""):`<div class="empty">${k==="milk"?"우유 신청 학생이 없어요. ‘⚙ 명단’에서 선택해 주세요.":"명단이 비어 있어요."}</div>`;
  const mb=k!=="milk"?"":milkPast()?`<button onclick="ask(this,milkToggle)">${lk?"🔓 잠금 풀기":"🔒 다시 잠그기"}</button>`:`<button onclick="allO('milk')">전체 O</button>`;
  const cnt=lk?`⭕<b class="c-o">${c.o}</b>🥛당번<b class="c-x">${c.n}</b>`:`⭕<b class="c-o">${c.o}</b>⬜<b class="c-n">${c.n}</b>`;
  const dn=full(k,list);return `<section class="panel${dn?" done":""}"><div class="ph"><h2>${title}${lk?" 🔒":""}${dn?" ✅":""}</h2><span class="cnt">${cnt}</span>${mb}</div><div class="grid" style="grid-template-rows:repeat(${Math.max(5,Math.ceil(list.length/5))},minmax(0,1fr))">${body}</div>${k==="milk"?milkNote(lk,ord):""}${lk?`<div class="lockov">${LOCK_SVG}</div>`:""}</section>`;
}
$.addEventListener("click",e=>{
  const s=e.target.closest(".s"); if(!s)return;
  if(lp){lp=0;return}
  const k=s.dataset.k,n=s.dataset.n,v=chk[k][n]||"";
  /* 경고주기: 한 번 누르면 ⚠, 두 번째는 ❌, 세 번째는 지워져요 (하루 동안 남아요) */
  if(warnMode){const w=chk.warn||(chk.warn={}),c=((w[n]||0)+1)%3;if(c)w[n]=c;else delete w[n];save(KD,chk);board();return}
  const at=atOf(k,n);
  if(at&&!(k==="phone"&&at==="late"))return; /* 지각생도 휴대폰 체크는 할 수 있어요 */
  if(k==="milk"&&milkLocked())return;
  const nx=v==="o"?"":"o";
  if(nx)chk[k][n]=nx; else delete chk[k][n];
  save(KD,chk); board();
});
function allO(k){if(k==="milk"&&milkLocked()){board();return}(k==="milk"?cfg.names.filter(n=>cfg.milk.includes(n)):cfg.names).forEach(n=>chk[k][n]="o");save(KD,chk);board()}
function clr(){chk={phone:{},milk:{},lateDone:chk.lateDone,warn:chk.warn};save(KD,chk);board()}
function setup(){
  const names=parse(draft);
  $.innerHTML=`<div class="setup"><header><h1>⚙ 명단 설정</h1>${cfg.names.length?`<button onclick="cfg=load(KC,cfg);draft=rosterTxt();mode='board';render()">취소</button>`:""}</header>
  <p class="h">① 학생 번호와 이름 (한 줄에 한 명) <span style="opacity:.8">— 예: 12 홍길동. 빠진 번호는 건너뛰면 돼요</span></p>
  <textarea id="ta" placeholder="1 김하늘&#10;2 이바다&#10;3 박구름">${esc(draft)}</textarea>
  <p class="h">② 우유 신청 학생 (${names.length}명 중 <b id="mc">${cfg.milk.filter(n=>names.includes(n)).length}</b>명 선택)</p>
  <div class="chips" id="chips"></div>
  <p class="h">③ 지각 예외 학생 <span style="opacity:.8">— 8시 50분이 지나도 지각으로 표시하지 않아요 (이유는 선생님만 볼 수 있어요)</span></p>
  <div class="chips" id="exchips"></div>
  <div id="exrs"></div>
  <p id="err" class="h" style="color:var(--no);font-weight:800"></p>
  <button class="pri" onclick="finish()">저장하고 시작</button>
  <p class="h" style="margin-top:22px">④ 선생님 비밀번호 <span style="opacity:.8">— 명단 · 시간표 · 메뉴 순서 바꾸기를 열 때 필요해요</span></p>
  <div class="tr"><button onclick="changePin()">🔑 비밀번호 바꾸기</button><span id="pwmsg" class="h" style="color:var(--ok);font-weight:800"></span></div>
  <p class="h" style="margin-top:22px">⑤ 데이터 옮기기 <span style="opacity:.8">— 다른 컴퓨터나 새 링크로 옮길 때: 원래 쓰던 곳에서 ‘백업 만들기’ → 글을 복사 → 새 곳에 붙여 넣고 ‘불러오기’</span></p>
  <div class="tr"><button onclick="bkMake()">📤 백업 만들기</button><button onclick="ask(this,bkLoad)">📥 붙여넣은 백업 불러오기</button><span id="bkmsg" class="h" style="font-weight:800"></span></div>
  <textarea id="bkt" style="height:90px;font-size:13px" placeholder="여기에 백업 글이 나오거나, 붙여 넣어요"></textarea></div>`;
  const ta=document.getElementById("ta"); drawChips(); drawEx();
  ta.addEventListener("input",()=>{draft=ta.value;drawChips();drawEx()});
}
function bkMake(){
  const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("classcheck:"))o[k]=localStorage.getItem(k)}}catch(e){}
  const t=document.getElementById("bkt"),m=document.getElementById("bkmsg");t.value=JSON.stringify(o);t.focus();t.select();
  const ok=()=>{m.style.color="var(--ok)";m.textContent="✅ 백업 글을 복사했어요. 새 곳에 붙여 넣으세요."},no=()=>{m.style.color="var(--ink)";m.textContent="글이 선택돼 있어요. Ctrl+C로 복사하세요."};
  try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}
}
function bkLoad(){
  const m=document.getElementById("bkmsg");let o;
  try{o=JSON.parse(document.getElementById("bkt").value)}catch(e){m.style.color="var(--no)";m.textContent="백업 글이 올바르지 않아요. 전체를 다시 붙여 넣어 주세요.";return}
  let n=0;Object.keys(o||{}).forEach(k=>{if(k.startsWith("classcheck:")&&typeof o[k]==="string"){try{localStorage.setItem(k,o[k]);n++}catch(e){}}});
  if(!n){m.style.color="var(--no)";m.textContent="불러올 내용이 없어요.";return}
  m.style.color="var(--ok)";m.textContent=`✅ ${n}개 항목을 불러왔어요. 잠시 후 새로 고침돼요.`;setTimeout(()=>location.reload(),1200);
}
function drawEx(){
  const names=parse(draft),ex=cfg.ex||(cfg.ex={}),box=document.getElementById("exchips"),rs=document.getElementById("exrs");if(!box)return;
  box.innerHTML=names.map(n=>`<button class="chip ${isEx(n)?"on":""}" data-c="${esc(n)}">${esc(n)}</button>`).join("");
  const on=names.filter(isEx);
  rs.innerHTML=on.length?on.map(n=>`<div class="tr"><b style="min-width:90px;font-size:18px">🕘 ${esc(n)}</b><input class="sgi exin" data-n="${esc(n)}" maxlength="40" value="${esc(ex[n]||"")}" placeholder="이유 (예: 아침 병원 진료, 아침 돌봄교실)"></div>`).join(""):`<p class="h" style="opacity:.7">예외 학생이 없어요. 위에서 이름을 누르면 추가돼요.</p>`;
  box.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const n=b.dataset.c;if(isEx(n))delete ex[n];else ex[n]="";drawEx()};
  rs.oninput=e=>{const t=e.target;if(t.classList.contains("exin"))ex[t.dataset.n]=t.value};
}
function drawChips(){
  const names=parse(draft); const box=document.getElementById("chips"); if(!box)return;
  box.innerHTML=names.map(n=>`<button class="chip ${cfg.milk.includes(n)?"on":""}" data-c="${esc(n)}">${esc(n)}</button>`).join("");
  document.getElementById("mc").textContent=cfg.milk.filter(n=>names.includes(n)).length;
  box.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const n=b.dataset.c;
    cfg.milk=cfg.milk.includes(n)?cfg.milk.filter(x=>x!==n):[...cfg.milk,n];drawChips()};
}
function finish(){
  const names=parse(draft); if(!names.length){document.getElementById("err").textContent="학생 이름을 입력해 주세요.";return}
  const no=parseNo(draft),dup=Object.values(no).filter((v,i,a)=>a.indexOf(v)!==i);
  if(dup.length){document.getElementById("err").textContent=`번호가 겹쳐요: ${[...new Set(dup)].join(", ")}번`;return}
  const ex={};Object.keys(cfg.ex||{}).forEach(n=>{if(names.includes(n))ex[n]=String(cfg.ex[n]||"").trim()});
  cfg={names,no,milk:cfg.milk.filter(n=>names.includes(n)),ex}; save(KC,cfg); mode="board"; render(); tick();
}
const tm=t=>{const [h,m]=String(t).split(":");return +h*60+ +m};
function tick(){autoCheck();const ck=document.getElementById("clk");if(ck)ck.textContent=clkTxt();const n=new Date(),m=n.getHours()*60+n.getMinutes();const can=!(mode!=="board"||TM.run||TM.ring)&&sched.on&&sched.rows.some(r=>r[3]&&m>=tm(r[1])&&m<tm(r[2])&&!noCls(r)),off=can&&Date.now()>wake;document.getElementById("off").style.display=off?"block":"none";document.getElementById("slp").style.display=can&&!off?"block":"none";if(!off)hideOm();brkTick()}
function schedView(){
  $.innerHTML=`<div class="setup"><header><h1>⏰ 화면 꺼짐 시간표</h1><button class="pri" onclick="doneSched()">완료</button></header>
  <p class="h"><label><input type="checkbox" ${sched.on?"checked":""} onchange="sched.on=this.checked;save(KS,sched)"> 시간표에 따라 화면 자동으로 끄기</label></p>
  <div id="rows"></div>

function spinUI(title,pool,picks,steps,done){
  const m=document.getElementById("sp");

/* ===== 번호로 신청 · 일주일 횟수 제한 · 이름 숨기기 (신청곡/놀이 공통) ===== */
const KQ="classcheck:quota",QMAX={song:3,game:1};
const wkKey=()=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}; /* 이번 주 월요일 */

function quota(){let q=load(KQ,null);if(!q)q={wk:wkKey(),song:{},game:{},srd:0};if(q.wk!==wkKey())q={wk:wkKey(),song:q.song||{},game:{},srd:q.srd||0};return q}
function qSongReset(){const q=quota();q.song={};q.srd=Date.now();save(KQ,q)}
const qWhen=k=>k==="song"?"다음 추첨까지":"이번 주";
const qLeft=(k,no)=>QMAX[k]-(quota()[k][no]||0);
function qAdd(k,no,dv){const q=quota();q[k][no]=Math.max(0,(q[k][no]||0)+dv);save(KQ,q)}
const noName=v=>{const n=+String(v).trim();return Number.isInteger(n)&&n>=1?cfg.names.find(x=>numOf(x)===n)||"":""};
const whoTxt=x=>x.an?"익명":(x.name||x.who||"");
function whoHTML(p){return `<div class="who"><label for="${p}_no">🙋 내 번호</label><input id="${p}_no" class="nob" inputmode="numeric" maxlength="2" placeholder="번호"><span id="${p}_nm" class="nmv"></span><label class="anon"><input type="checkbox" id="${p}_an"> 🙈 이름 숨기기</label></div>`}
function whoBind(p,k){
  const i=document.getElementById(p+"_no"),s=document.getElementById(p+"_nm");
  const up=()=>{const n=noName(i.value),no=+i.value;if(!i.value.trim()){s.textContent="";return}
    if(!n){s.textContent="없는 번호예요";s.style.color="var(--no)";return}
    const l=Math.max(0,qLeft(k,no));s.textContent=`${n} · ${qWhen(k)} ${l}번 남음`;s.style.color=l?"var(--ink)":"var(--no)"};
  i.addEventListener("input",up);up();
}
function whoGet(p,k,err){
  const v=document.getElementById(p+"_no").value.trim(),no=+v,n=noName(v);
  if(!n){err("내 번호를 바르게 적어 주세요.");return null}
  if(qLeft(k,no)<=0){err(`${no}번은 ${qWhen(k)} 신청을 다 했어요. (${k==="song"?"노래는 추첨이 끝날 때마다 3곡씩 다시 신청할 수 있어요":"놀이는 일주일에 1번"})`);return null}

function qRefund(k,x){if(x&&x.no&&(k==="song"?(x.rd||0)===(quota().srd||0):x.wk===wkKey()))qAdd(k,x.no,-1)} /* 선생님이 ✕로 지우면 횟수를 돌려줘요 */

/* ===== 쉬는시간 타이머 (체크판 화면 가운데) =====
   시간표에서 '화면 켬' 시간 중 바로 다음이 수업(화면 끔)인 시간이 쉬는시간이에요. (아침시간 제외, 점심시간 포함)
   다음 수업 시작 2분 전에 끝나고, 마지막 10초는 '삐' 소리로 알려 줘요. */
let brkSaid=-1;
/* 수업 시간은 이름(○교시)으로 판단해요. 수업 중에 '화면 켬'으로 바꿔도 쉬는시간으로 착각하지 않아요 */
const isCls=r=>/\d+\s*교시/.test(String(r[0]))||(!sched.rows.some(x=>/\d+\s*교시/.test(String(x[0])))&&!!r[3]);
const perOf=(r,i)=>{const m=String(r[0]).match(/(\d+)\s*교시/);if(m)return +m[1];return sched.rows.slice(0,i+1).filter(isCls).length};
function curBreak(){
  if(!school())return null;
  const n=new Date(),now=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,rs=sched.rows;
  for(let i=0;i<rs.length-1;i++){
    const r=rs[i],nx=rs[i+1];
    if(isCls(r)||!isCls(nx)||/아침/.test(r[0]))continue;
    const st=tm(r[1]),en=tm(nx[1])-2;
    if(now<st||now>=en)continue;
    const per=perOf(nx,i+1),dy=tt[d.getDay()-1]||[],sub=(dy[per-1]||"").trim();
    if(!sub)continue; /* 학급시간표에서 다음 교시가 비어 있으면 수업이 없는 것 → 타이머·소리 없음 */
    const end=new Date(n.getFullYear(),n.getMonth(),n.getDate(),0,en,0,0).getTime();
    return {name:r[0],per,sub,left:Math.max(0,Math.ceil((end-Date.now())/1000))};
  }
  return null;
}
/* 학급시간표에 과목이 비어 있는 교시는 수업이 없는 시간 → 화면을 끄지 않아요 (시간표를 하나도 안 적었으면 예전처럼 꺼져요) */
function noCls(r){
  if(!isCls(r)||!tt.some(x=>x.some(Boolean)))return false;
  const m=String(r[0]).match(/(\d+)\s*교시/);if(!m)return false;
  const dy=tt[d.getDay()-1];return !!dy&&!(dy[+m[1]-1]||"").trim();
}
function brkTick(){

}

/* 타임타이머 모양 시계: 0이 맨 위, 숫자는 반시계 방향, 시간이 지날수록 빨간색이 차올라요 */
const dPt=(th,r)=>{const a=th*Math.PI/180;return [+(200+r*Math.sin(a)).toFixed(2),+(200-r*Math.cos(a)).toFixed(2)]};
function dWedge(th,r){
  if(th<=0.05)return "M200 200";
  if(th>=359.9)return `M200 ${200-r} A${r} ${r} 0 1 0 200 ${200+r} A${r} ${r} 0 1 0 200 ${200-r} Z`;
  const e=dPt(th,r);return `M200 200 L200 ${200-r} A${r} ${r} 0 ${th>180?1:0} 1 ${e[0]} ${e[1]} Z`;
}
function dElapsed(){return TM.total-(TM.run?Math.max(0,(TM.end-Date.now())/1000):TM.left)}
function dialSVG(){

  else if(!c&&v){const m=vw&&KB_VC[v+j];if(m)KB.v=m;else{commit=v;KB.v="";vw?KB.v=j:KB.c=j}}
  else if(!f){
    if(vw){const m=KB_VC[v+j];if(m)KB.v=m;else{commit=kbCur();KB.c="";KB.v=j}}
    else if(KB_JONG.includes(j))KB.f=j;
    else{commit=kbCur();KB.c=j;KB.v=""}
  }else if(vw){
    const p=kbSplit(KB_FC,f);
    if(p){KB.f=p[0];commit=kbCur();KB.c=p[1];KB.v=j;KB.f=""}
    else{KB.f="";commit=kbCur();KB.c=f;KB.v=j}
  }else{
    const m=KB_FC[f+j];
    if(m)KB.f=m;else{commit=kbCur();KB.c=j;KB.v="";KB.f=""}
  }
  kbWrite(el,commit);
}
function kbChar(t){
  const el=kbEl();if(!el)return;
  if(el.type==="number"){if(/^\d$/.test(t)){el.value=String(el.value)+t;kbFire(el)}return}
  kbSync(el);kbReset();
  kbPut(el,el.selectionStart,el.selectionEnd,t);
}
function kbBack(){
  const el=kbEl();if(!el)return;
  if(el.type==="number"){el.value=String(el.value).slice(0,-1);kbFire(el);return}
  kbSync(el);
  if(KB.pos>=0){
    const st=KB.pos-1;
    if(KB.f){const p=kbSplit(KB_FC,KB.f);KB.f=p?p[0]:""}
    else if(KB.v){const p=kbSplit(KB_VC,KB.v);KB.v=p?p[0]:""}
    else KB.c="";
    const cur=kbCur();
    kbPut(el,st,KB.pos,cur);
    if(cur){KB.pos=st+1;KB.shown=cur}else kbReset();
    return;
  }
  let s=el.selectionStart,e=el.selectionEnd;
  if(s===e){if(!s)return;s--}
  kbPut(el,s,e,"");
}
function kbEnter(){
  const el=kbEl();if(!el||el.type==="number")return;
  kbSync(el);kbReset();
  if(el.tagName==="TEXTAREA"){kbPut(el,el.selectionStart,el.selectionEnd,"\n");return}
  ["keydown","keyup"].forEach(t=>el.dispatchEvent(new KeyboardEvent(t,{key:"Enter",code:"Enter",keyCode:13,which:13,bubbles:true})));
}
function kbMove(dx){
  const el=kbEl();if(!el||el.type==="number")return;
  kbSync(el);kbReset();
  const p=Math.max(0,Math.min(el.value.length,(dx<0?el.selectionStart:el.selectionEnd)+dx));
  el.setSelectionRange(p,p);
}
function kbPress(b){
  const t=b.dataset.t,k=b.dataset.k||"";
  if(t==="bs")return kbBack();
  if(t==="ent")return kbEnter();
  if(t==="sp")return kbChar(" ");
  if(t==="L")return kbMove(-1);
  if(t==="R")return kbMove(1);
  if(t==="x")return kbHide();
  if(t==="sh"){KB.sh=(KB.sh+1)%(KB.lang==="en"&&!KB.sym?3:2);return kbDraw()}
  if(t==="lang"){KB.lang=KB.lang==="ko"?"en":"ko";KB.sh=0;KB.sym=false;kbReset();return kbDraw()}
  if(t==="sym"){KB.sym=!KB.sym;return kbDraw()}
  if(t==="j")kbJamo(k);else if(t==="c")kbChar(k);
  if(KB.sh===1){KB.sh=0;kbDraw()}
}
function kbDraw(){
  const r=document.getElementById("kbr");if(!r)return;
  const ko=KB.lang==="ko",up=KB.sh>0;
  const key=(t,k,l,fx,cls)=>`<button type="button" class="kk${cls?" "+cls:""}" data-t="${t}" data-k="${esc(k)}" style="flex:${fx}">${esc(l)}</button>`;
  const sp=f=>`<span style="flex:${f}"></span>`;
  const num=[...KB_NUM].map((x,i)=>{const c=up?KB_NUMS[i]:x;return key("c",c,c,1)}).join("");
  const row=i=>{
    if(KB.sym)return[...KB_SY[i]].map(x=>key("c",x,x,1)).join("");
    if(ko)return[...KB_KO[i]].map(x=>{const m=up&&KB_SHK[x]||x;return key("j",m,m,1)}).join("");
    return[...KB_EN[i]].map(x=>{const m=up?x.toUpperCase():x;return key("c",m,m,1)}).join("");
  };
  r.innerHTML=
   `<div class="kr">${num}${key("bs","","⌫",1.5,"fn")}</div>`+
   `<div class="kr">${row(0)}${sp(1.5)}</div>`+
   `<div class="kr">${sp(.5)}${row(1)}${key("ent","","엔터",2,"fn")}</div>`+
   `<div class="kr">${key("sh","",KB.sh===2?"⇪":"⇧",1.5,"fn"+(KB.sh?" on":""))}${row(2)}${[",",".","?"].map(x=>key("c",x,x,1)).join("")}</div>`+
   `<div class="kr">${key("lang","",ko?"한글":"ENG",1.5,"fn")}${key("sym","",KB.sym?"문자":"기호",1.5,"fn"+(KB.sym?" on":""))}${key("L","","◀",1,"fn")}${key("sp","","띄어쓰기",4.5)}${key("R","","▶",1,"fn")}${key("x","","닫기",2,"fn")}</div>`;
}
/* 화면 키보드가 켜져 있으면 안드로이드/윈도 기본 키보드는 띄우지 않게 해요 */
function kbNoNative(t){if(t.dataset.kbim===undefined)t.dataset.kbim=t.getAttribute("inputmode")||"";t.setAttribute("inputmode","none")}
function kbFit(){const k=document.getElementById("kb");if(KB.on&&k)document.documentElement.style.setProperty("--kbh",k.offsetHeight+"px")}
function kbShow(){
  KB.on=true;kbDraw();
  document.getElementById("kb").style.display="block";document.body.classList.add("kbon");
  const a=document.activeElement;if(kbOK(a)){KB.el=a;kbNoNative(a)}
  kbUI();
  setTimeout(()=>{const t=kbEl();if(t&&t.scrollIntoView)try{t.scrollIntoView({block:"nearest"})}catch(x){}},60);
}
function kbHide(){
  KB.on=false;kbReset();kbStopRep();
  const k=document.getElementById("kb");if(k)k.style.display="none";
  document.body.classList.remove("kbon");document.documentElement.style.removeProperty("--kbh");
  document.querySelectorAll("[data-kbim]").forEach(e=>{const v=e.dataset.kbim;v?e.setAttribute("inputmode",v):e.removeAttribute("inputmode");delete e.dataset.kbim});
  kbUI();
}
function kbToggle(){KB.on?kbHide():kbShow()}
/* 화면이 바뀔 때마다: 체크판으로 돌아오면 키보드를 닫고, 글쓰는 화면에는 ⌨ 버튼을 보여 줘요 */
function kbUI(){
  if(KB.on&&mode==="board"&&kbPrev!=="board")kbHide();
  kbPrev=mode;
  const f=document.getElementById("kbfab");if(f)f.style.display=(!KB.on&&mode!=="board")?"block":"none";
  kbFit();
}
function kbStopRep(){clearTimeout(kbRep);clearInterval(kbRepI)}
(function(){
  const k=document.getElementById("kb");if(!k)return;
  k.addEventListener("pointerdown",e=>{
    const b=e.target.closest(".kk");if(!b)return;
    e.preventDefault();kbStopRep();kbPress(b);
    if(b.dataset.t==="bs")kbRep=setTimeout(()=>{kbRepI=setInterval(kbBack,60)},420);
  });
  k.addEventListener("mousedown",e=>e.preventDefault());
  k.addEventListener("contextmenu",e=>e.preventDefault());
  ["pointerup","pointercancel","pointerleave"].forEach(t=>k.addEventListener(t,kbStopRep));
})();
document.addEventListener("focusin",e=>{
  const t=e.target;if(!kbOK(t))return;
  KB.el=t;
  if(!KB.on&&mode!=="board"){kbShow();return}
  if(KB.on){kbNoNative(t);requestAnimationFrame(()=>{try{t.scrollIntoView({block:"nearest"})}catch(x){}})}
});
window.addEventListener("resize",kbFit);


/* ===== 자동 업데이트 =====
   웹 주소로 열었을 때 1분마다 새 버전이 있는지 확인해요.
   새 버전이면 위에 안내를 띄우고, 체크판 화면에서 타이머·입력이 없을 때 30초 쉬면 새로고침해요.
   학생 기록(localStorage)은 그대로 남아요. */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  const cur=(document.querySelector('meta[name="build"]')||{}).content||"";
  let last=Date.now(),ready=false;
  ["pointerdown","keydown","touchstart"].forEach(e=>document.addEventListener(e,()=>{last=Date.now()},{passive:true,capture:true}));
  const bar=()=>{if(document.getElementById("updbar"))return;const b=document.createElement("div");b.id="updbar";
    b.style.cssText="position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);transform:translateX(-50%);z-index:99999;background:var(--pri);color:#fff;font-weight:800;padding:8px 14px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font-size:clamp(12px,1.6vw,18px)";
    b.textContent="🔄 새 버전이 있어요 — 눌러서 바로 적용";b.onclick=()=>location.reload();document.body.appendChild(b)};
  const safe=()=>{const a=document.activeElement;
    return mode==="board"&&!TM.run&&!TM.ring&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&Date.now()-last>30000};
  async function check(){try{
    const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const m=(await r.text()).match(/<meta name="build" content="([^"]+)"/);
    if(m&&cur&&m[1]!==cur){ready=true;bar()}}catch(e){}}
  setInterval(check,60000);setTimeout(check,5000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  setInterval(()=>{if(ready&&safe())location.reload()},5000);
})();

render();tick();
</script>
